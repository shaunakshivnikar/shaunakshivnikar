name: Generate Contribution Snake

on:
  # Regenerate once a day
  schedule:
    - cron: "0 0 * * *"
  # Allow a manual run from the Actions tab (needed for the first run)
  workflow_dispatch:
  # Regenerate whenever the profile repo itself changes
  push:
    branches:
      - main

# The snake SVGs are pushed to the `output` branch, which needs write access
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
